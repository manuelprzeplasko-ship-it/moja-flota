<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Moja Flota — zgłoszenie</title><link rel="stylesheet" href="style.css"></head><body><header><h1>🚙 Zgłoszenie kierowcy</h1></header><main class="narrow"><section class="card"><h2 id="vehicleName">Wczytywanie pojazdu…</h2><p id="vehiclePlate" class="muted"></p><form id="reportForm" hidden><label>Imię kierowcy<input id="driverName" maxlength="80" required></label><label>Stan licznika (km)<input id="odometer" type="number" min="0" max="9999999" step="1" required></label><label>Usterka / uwagi (opcjonalnie)<textarea id="note" maxlength="1500" rows="4" placeholder="Opisz ewentualny problem"></textarea></label><button id="send">Wyślij zgłoszenie</button></form><p id="message" role="status"></p></section></main><script type="module" src="driver.js"></script></body></html>
